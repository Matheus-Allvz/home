<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="telemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glowTelem" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Shield Badge Frame -->
  <polygon points="150,30 235,70 235,175 150,250 65,175 65,70" fill="#0b1329" stroke="url(#telemGrad)" stroke-width="3" filter="url(#glowTelem)" />
  <polygon points="150,48 218,80 218,165 150,228 82,165 82,80" fill="#070d1e" stroke="#38bdf8" stroke-width="1" opacity="0.6" />
  
  <!-- Oscilloscope Waveform / RCA Diagnostic Wave -->
  <path d="M90,140 L115,140 L125,110 L135,170 L145,95 L155,160 L165,130 L175,145 L210,145" fill="none" stroke="#00f2fe" stroke-width="2.5" filter="url(#glowTelem)" />
  
  <!-- Metric Rating Badge -->
  <circle cx="150" cy="85" r="22" fill="#042f2e" stroke="#10b981" stroke-width="2" />
  <text x="150" y="90" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#34d399" text-anchor="middle">14.75</text>
  
  <!-- Growth Arrow -->
  <polygon points="150,185 165,205 135,205" fill="#10b981" filter="url(#glowTelem)" />
</svg>