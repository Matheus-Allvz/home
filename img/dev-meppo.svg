<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="meppoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glowMeppo" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Turbine Outer Rings -->
  <circle cx="150" cy="150" r="125" fill="none" stroke="url(#meppoGrad)" stroke-width="2" stroke-dasharray="16 8" opacity="0.5" />
  <circle cx="150" cy="150" r="105" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.3" />
  
  <!-- Hexagonal Turbine Core -->
  <polygon points="150,45 235,95 235,205 150,255 65,205 65,95" fill="#1f1412" stroke="url(#meppoGrad)" stroke-width="3" filter="url(#glowMeppo)" />
  
  <!-- Lightning Automation Bolt -->
  <path d="M158,65 L120,145 L155,145 L135,235 L190,135 L152,135 Z" fill="url(#meppoGrad)" filter="url(#glowMeppo)" />
  
  <!-- Orbiting API Integration Nodes (ClickUp, WhatsApp, REST) -->
  <circle cx="65" cy="95" r="14" fill="#0f172a" stroke="#25D366" stroke-width="2" />
  <circle cx="65" cy="95" r="5" fill="#25D366" />
  
  <circle cx="235" cy="95" r="14" fill="#0f172a" stroke="#7B68EE" stroke-width="2" />
  <circle cx="235" cy="95" r="5" fill="#7B68EE" />
  
  <circle cx="150" cy="255" r="14" fill="#0f172a" stroke="#00f2fe" stroke-width="2" />
  <circle cx="150" cy="255" r="5" fill="#00f2fe" />
  
  <!-- Speed lines -->
  <line x1="85" y1="130" x2="105" y2="130" stroke="#f59e0b" stroke-width="2" opacity="0.8" />
  <line x1="195" y1="170" x2="215" y2="170" stroke="#f59e0b" stroke-width="2" opacity="0.8" />
</svg>