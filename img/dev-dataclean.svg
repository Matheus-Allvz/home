<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="dataGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glowData" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Matrix Rings -->
  <circle cx="150" cy="150" r="128" fill="none" stroke="url(#dataGrad)" stroke-width="1.5" stroke-dasharray="12 8" opacity="0.4" />
  <circle cx="150" cy="150" r="108" fill="none" stroke="#10b981" stroke-width="1" opacity="0.3" />
  
  <!-- Isometric Grid / Multi-Format Sheet Matrix -->
  <g transform="translate(0, -10)">
    <!-- Layer 3 (Bottom) -->
    <polygon points="150,150 220,185 150,220 80,185" fill="#064e3b" stroke="#10b981" stroke-width="1.5" opacity="0.5" />
    <!-- Layer 2 (Middle) -->
    <polygon points="150,115 220,150 150,185 80,150" fill="#083344" stroke="#06b6d4" stroke-width="2" opacity="0.7" />
    <!-- Layer 1 (Top - Active Parser) -->
    <polygon points="150,80 220,115 150,150 80,115" fill="#0f172a" stroke="url(#dataGrad)" stroke-width="2.5" filter="url(#glowData)" />
    
    <!-- Spreadsheet Grid Lines on Top Layer -->
    <line x1="115" y1="97" x2="185" y2="132" stroke="#06b6d4" stroke-width="1" opacity="0.8" />
    <line x1="185" y1="97" x2="115" y2="132" stroke="#10b981" stroke-width="1" opacity="0.8" />
  </g>
  
  <!-- Central Filter Funnel / Cleanse Laser Core -->
  <circle cx="150" cy="120" r="22" fill="#042f2e" stroke="#10b981" stroke-width="2" filter="url(#glowData)" />
  <path d="M142,112 L158,112 L152,122 L152,130 L148,130 L148,122 Z" fill="#34d399" />
  
  <!-- Data Floating Packets -->
  <circle cx="75" cy="100" r="5" fill="#10b981" />
  <circle cx="225" cy="95" r="5" fill="#06b6d4" />
  <circle cx="235" cy="190" r="4" fill="#3b82f6" />
  <circle cx="65" cy="180" r="4" fill="#10b981" />
  <circle cx="150" cy="245" r="5" fill="#06b6d4" />
  
  <text x="150" y="275" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#34d399" text-anchor="middle" letter-spacing="3">&lt;PARSER_CORE/&gt;</text>
</svg>