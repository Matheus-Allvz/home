<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff88" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glowChip" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Silicon Circuit Board -->
  <circle cx="150" cy="150" r="125" fill="none" stroke="url(#chipGrad)" stroke-width="1.5" stroke-dasharray="14 6" opacity="0.4" />
  
  <!-- Processor IC Package -->
  <rect x="90" y="90" width="120" height="120" rx="14" fill="#09131f" stroke="url(#chipGrad)" stroke-width="3" filter="url(#glowChip)" />
  
  <!-- Silicon Die Core -->
  <rect x="115" y="115" width="70" height="70" rx="8" fill="#030712" stroke="#00ff88" stroke-width="1.5" />
  <text x="150" y="156" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="bold" fill="#00ff88" text-anchor="middle" letter-spacing="1">C / MCU</text>
  
  <!-- Pin Traces (Top & Bottom) -->
  <line x1="105" y1="90" x2="105" y2="55" stroke="#06b6d4" stroke-width="2.5" />
  <line x1="135" y1="90" x2="135" y2="55" stroke="#00ff88" stroke-width="2.5" />
  <line x1="165" y1="90" x2="165" y2="55" stroke="#00ff88" stroke-width="2.5" />
  <line x1="195" y1="90" x2="195" y2="55" stroke="#06b6d4" stroke-width="2.5" />
  
  <line x1="105" y1="210" x2="105" y2="245" stroke="#06b6d4" stroke-width="2.5" />
  <line x1="135" y1="210" x2="135" y2="245" stroke="#00ff88" stroke-width="2.5" />
  <line x1="165" y1="210" x2="165" y2="245" stroke="#00ff88" stroke-width="2.5" />
  <line x1="195" y1="210" x2="195" y2="245" stroke="#06b6d4" stroke-width="2.5" />
  
  <!-- Pin Traces (Left & Right) -->
  <line x1="90" y1="105" x2="55" y2="105" stroke="#06b6d4" stroke-width="2.5" />
  <line x1="90" y1="135" x2="55" y2="135" stroke="#00ff88" stroke-width="2.5" />
  <line x1="90" y1="165" x2="55" y2="165" stroke="#00ff88" stroke-width="2.5" />
  <line x1="90" y1="195" x2="55" y2="195" stroke="#06b6d4" stroke-width="2.5" />
  
  <line x1="210" y1="105" x2="245" y2="105" stroke="#06b6d4" stroke-width="2.5" />
  <line x1="210" y1="135" x2="245" y2="135" stroke="#00ff88" stroke-width="2.5" />
  <line x1="210" y1="165" x2="245" y2="165" stroke="#00ff88" stroke-width="2.5" />
  <line x1="210" y1="195" x2="245" y2="195" stroke="#06b6d4" stroke-width="2.5" />
</svg>