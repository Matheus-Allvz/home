<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="csharpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="coreGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Tech Orbital Rings -->
  <circle cx="150" cy="150" r="130" fill="none" stroke="url(#csharpGrad)" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.4" />
  <circle cx="150" cy="150" r="115" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.3" />
  
  <!-- Outer Rotating Hexagon Frame -->
  <polygon points="150,30 240,82 240,186 150,238 60,186 60,82" fill="url(#coreGlow)" stroke="url(#csharpGrad)" stroke-width="3" filter="url(#glow)" />
  
  <!-- Isometric Inner Cube / Clean Architecture Layers -->
  <!-- Top Face -->
  <polygon points="150,75 205,107 150,139 95,107" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1.5" opacity="0.9" />
  <!-- Left Face -->
  <polygon points="95,107 150,139 150,203 95,171" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5" opacity="0.9" />
  <!-- Right Face -->
  <polygon points="150,139 205,107 205,171 150,203" fill="#1e1338" stroke="#ec4899" stroke-width="1.5" opacity="0.9" />
  
  <!-- Circuit Nodes and Traces -->
  <line x1="150" y1="30" x2="150" y2="75" stroke="#00f2fe" stroke-width="2" />
  <line x1="240" y1="82" x2="205" y2="107" stroke="#38bdf8" stroke-width="2" />
  <line x1="240" y1="186" x2="205" y2="171" stroke="#ec4899" stroke-width="2" />
  <line x1="60" y1="186" x2="95" y2="171" stroke="#8b5cf6" stroke-width="2" />
  <line x1="60" y1="82" x2="95" y2="107" stroke="#00f2fe" stroke-width="2" />
  <line x1="150" y1="238" x2="150" y2="203" stroke="#8b5cf6" stroke-width="2" />
  
  <!-- Central C# & .NET Core Emblem -->
  <circle cx="150" cy="139" r="28" fill="#090d16" stroke="url(#csharpGrad)" stroke-width="2" filter="url(#glow)" />
  <text x="150" y="146" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="bold" fill="#00f2fe" text-anchor="middle" letter-spacing="1">C#</text>
  
  <!-- Tech Pulsing Nodes -->
  <circle cx="150" cy="30" r="4" fill="#00f2fe" />
  <circle cx="240" cy="82" r="4" fill="#38bdf8" />
  <circle cx="240" cy="186" r="4" fill="#ec4899" />
  <circle cx="150" cy="238" r="4" fill="#8b5cf6" />
  <circle cx="60" cy="186" r="4" fill="#8b5cf6" />
  <circle cx="60" cy="82" r="4" fill="#00f2fe" />
</svg>